name: "Auto Title PR"

on:
  pull_request_target:
    types: [opened]

jobs:
  format-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            // Regex para extrair tipo, id da issue e slug da branch (ex: feat/42-comunicacao-backend-ia)
            const match = branchName.match(/^(feat|fix|refactor|docs|style|test|chore|ci)\/([0-9]+)-(.*)$/);

            if (!match) {
              console.log('Branch fora do padrão esperado. Nenhuma ação tomada.');
              return;
            }

            const [, type, issueId, slug] = match;
            let cleanTitle = '';

            try {
              // Busca o título original da Issue no GitHub (#42)
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueId, 10)
              });
              // Remove o prefixo "[EAP x.x.x]" do título da Issue se existir
              cleanTitle = issue.data.title.replace(/^\[EAP\s+[0-9\.]+\]\s*/i, '');
            } catch (error) {
              // Se a Issue não for encontrada, converte o slug da branch em texto legível
              cleanTitle = slug.replace(/-/g, ' ');
              cleanTitle = cleanTitle.charAt(0).toUpperCase() + cleanTitle.slice(1);
            }

            const newTitle = `[#${issueId}] ${cleanTitle}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              title: newTitle
            });